# Tiny Tapeout project information
project:
  title: "8-bit UART Transmitter"
  author: "Nevin Philip"
  discord: ""
  description: "Simple 8-bit UART transmitter using Verilog in TinyTapeout"
  language: "Verilog"
  clock_hz: 1000000

  # how many tiles your design occupies
  tiles: "1x1"

  # top module name
  top_module: "tt_um_uart_tx"

  # source files
  source_files:
    - "project.v"

# Pinout
pinout:

  # Inputs
  ui[0]: "data_bit_0"
  ui[1]: "data_bit_1"
  ui[2]: "data_bit_2"
  ui[3]: "data_bit_3"
  ui[4]: "data_bit_4"
  ui[5]: "data_bit_5"
  ui[6]: "data_bit_6"
  ui[7]: "data_bit_7"

  # Outputs
  uo[0]: "uart_tx"
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change
yaml_version: 6
